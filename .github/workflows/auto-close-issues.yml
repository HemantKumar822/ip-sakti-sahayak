name: Auto Close Issues on Develop Merge

on:
  pull_request:
    types: [closed]
    branches:
      - develop
      - main

permissions:
  issues: write
  pull-requests: read

jobs:
  close-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Close linked issues
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const prBody = pr.body || '';
            const prTitle = pr.title || '';
            const prNumber = pr.number;
            const textToSearch = `${prTitle}\n${prBody}`;

            // Regex matches keywords like Closes #123, Fixes #45, Resolves #67
            const regex = /(?:close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\s+(?:https:\/\/github\.com\/[^/]+\/[^/]+\/issues\/|#)?(\d+)/gi;
            let match;
            const issueNumbers = new Set();

            while ((match = regex.exec(textToSearch)) !== null) {
              const issueNum = parseInt(match[1], 10);
              if (issueNum !== prNumber) {
                issueNumbers.add(issueNum);
              }
            }

            if (issueNumbers.size === 0) {
              console.log('No issue closing keywords found in PR title or body.');
              return;
            }

            console.log(`Found issues to close: ${Array.from(issueNumbers).join(', ')}`);

            for (const issueNumber of issueNumbers) {
              try {
                // Add a comment to the issue
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: `Resolved by PR #${prNumber} (\`${prTitle}\`) merged into \`${pr.base.ref}\`.`
                });

                // Close the issue
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  state: 'closed',
                  state_reason: 'completed'
                });

                console.log(`Successfully closed issue #${issueNumber}`);
              } catch (error) {
                console.error(`Failed to close issue #${issueNumber}:`, error.message);
              }
            }
