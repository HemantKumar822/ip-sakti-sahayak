[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=src --cov=ingestion --cov-report=term-missing --cov-report=html:htmlcov --cov-report=xml --cov-fail-under=70"

[tool.coverage.run]
source = ["src", "ingestion"]
omit = [
    "src/frontend/*",
]

[tool.coverage.report]
show_missing = true
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.pyrefly]
search-path = ["."]

[tool.pyright]
extraPaths = ["."]
