version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: gunicorn -k uvicorn.workers.UvicornWorker -w 2 -b 0.0.0.0:8000 src.main:app
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - CHROMA_PERSIST_DIR=/app/chroma_db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - chroma_data:/app/chroma_db
    restart: unless-stopped
    depends_on:
      - redis
    networks:
      - internal_net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    command: streamlit run src/frontend/app.py --server.port=8501 --server.address=0.0.0.0 --server.enableCORS=false
    environment:
      - API_HOST=backend
      - API_PORT=8000
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - internal_net

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - internal_net

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - internal_net

volumes:
  chroma_data:
  redis_data:

networks:
  internal_net:
    driver: bridge
